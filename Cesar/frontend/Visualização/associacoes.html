<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <title>Associações Budistas</title>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary-color: #499a6e;
      --secondary-color: #3a7a5a;
      --bg-light: #f8f9fa;
      --text-dark: #333;
    }
    body {
      font-family: 'Roboto', sans-serif;
      background: var(--bg-light);
      margin: 0;
      padding: 20px;
    }
    .container {
      max-width: 1200px;
      margin: 0 auto;
      background: #fff;
      border-radius: 12px;
      padding: 20px;
      box-shadow: 0 3px 8px rgba(0,0,0,0.1);
    }
    h1 {
      text-align: center;
      color: var(--primary-color);
      margin-bottom: 20px;
    }
    .filtro-container { margin-bottom: 20px; }
    .filtros { display: flex; flex-wrap: wrap; gap: 15px; }
    .filtros input {
      flex: 1;
      min-width: 150px;
      padding: 12px;
      border: 1px solid #ddd;
      border-radius: 8px;
      font-size: 1rem;
    }
    .tabela-container { 
        overflow-x: auto; 
        margin-top: 20px;
        /* MUDANÇA: Adiciona uma altura máxima e barra de rolagem vertical */
        max-height: 70vh; 
        overflow-y: auto;
    }
    table { width: 100%; border-collapse: collapse; }
    th, td {
      padding: 15px;
      text-align: left;
      border-bottom: 1px solid #eee;
      vertical-align: middle;
    }
    th { 
        background: var(--primary-color); 
        color: #fff;
        /* MUDANÇA: Deixa o cabeçalho fixo no topo da tabela */
        position: sticky;
        top: 0;
        z-index: 1;
    }
    tr:hover { background: #f1f1f1; }
    .detalhes-btn {
      background: var(--primary-color);
      color: #fff;
      padding: 8px 16px;
      border-radius: 20px;
      text-decoration: none;
      font-size: 0.9rem;
      transition: background 0.3s;
      white-space: nowrap;
    }
    .detalhes-btn:hover { background: var(--secondary-color); }
    .loading { text-align: center; margin-top: 20px; color: var(--text-dark); }
    
    /* --- ESTILOS PARA A IMAGEM NA TABELA --- */
    .profile-image-table {
        width: 50px;
        height: 50px;
        border-radius: 50%;
        object-fit: cover;
        border: 2px solid #ddd;
    }
    .placeholder-image {
        width: 50px;
        height: 50px;
        border-radius: 50%;
        background-color: #e9ecef;
        display: flex;
        align-items: center;
        justify-content: center;
        color: #adb5bd;
        font-size: 1.5rem;
        font-weight: bold;
    }
  </style>
</head>
<body>
    <div class="container">
      <h1>Associações Budistas</h1>
      <div class="filtro-container">
        <div class="filtros">
          <input type="text" id="nome" list="nomes" placeholder="Buscar por nome" oninput="filtrarAssociacoes()" />
          <datalist id="nomes"></datalist>
          <input type="text" id="pais" list="paises" placeholder="Filtrar por país" oninput="filtrarAssociacoes()" />
          <datalist id="paises"></datalist>
          <input type="text" id="grau" list="graus" placeholder="Filtrar por grau" oninput="filtrarAssociacoes()" />
          <datalist id="graus"></datalist>
        </div>
      </div>
      <div class="tabela-container">
        <table id="tabela-associacoes">
          <thead>
            <tr>
              <th>Imagem</th>
              <th>Nome</th>
              <th>País de Atuação</th>
              <th>Grau</th>
              <th>Detalhes</th>
            </tr>
          </thead>
          <tbody id="associacoes-body"></tbody>
        </table>
        <div class="loading" id="loading">Carregando dados...</div>
      </div>
      </div>
    <script>
      let cacheAssociacoes = [];
      const baseUrl = 'http://localhost:5000'; // Deixado vazio para funcionar no servidor online

      function removeAccents(str) {
        if (!str) return "";
        return str.normalize("NFD").replace(/[\u00c0-\u024f]/g, "");
      }

      window.onload = async () => {
        document.getElementById('loading').style.display = 'block';
        try {
          if (cacheAssociacoes.length === 0) {
            const resp = await fetch(`${baseUrl}/api/associacoes?all=true`);
            if (!resp.ok) throw new Error('Erro na resposta da API');
            const dados = await resp.json();
            cacheAssociacoes = dados.data || [];
            popularDatalists(cacheAssociacoes);
          }
          // Exibe todos os resultados inicialmente
          exibirAssociacoes(cacheAssociacoes);
        } catch (err) {
          alert("Não foi possível carregar as associações. Verifique o console para detalhes.");
        } finally {
          document.getElementById('loading').style.display = 'none';
        }
      };

      function popularDatalists(associacoes) {
        const nomesSet = new Set();
        const paisesSet = new Set();
        const grausSet = new Set();
        associacoes.forEach(a => {
          if (a.NOME_ASSOCIACAO) nomesSet.add(a.NOME_ASSOCIACAO);
          if (a.PAIS_ATUACAO) paisesSet.add(a.PAIS_ATUACAO);
          if (a.GRAU) grausSet.add(a.GRAU);
        });
        document.getElementById('nomes').innerHTML = [...nomesSet].sort().map(n => `<option value="${n}">`).join('');
        document.getElementById('paises').innerHTML = [...paisesSet].sort().map(p => `<option value="${p}">`).join('');
        document.getElementById('graus').innerHTML = [...grausSet].sort().map(g => `<option value="${g}">`).join('');
      }

      function filtrarAssociacoes() {
        const nomeInput = removeAccents(document.getElementById('nome').value).toLowerCase();
        const paisInput = removeAccents(document.getElementById('pais').value).toLowerCase();
        const grauInput = removeAccents(document.getElementById('grau').value).toLowerCase();

        const filtrados = cacheAssociacoes.filter(a => {
          const nome = a.NOME_ASSOCIACAO ? removeAccents(a.NOME_ASSOCIACAO).toLowerCase() : '';
          const pais = a.PAIS_ATUACAO ? removeAccents(a.PAIS_ATUACAO).toLowerCase() : '';
          const grau = a.GRAU ? removeAccents(a.GRAU).toLowerCase() : '';
          return nome.includes(nomeInput) && pais.includes(paisInput) && grau.includes(grauInput);
        });
        // Exibe todos os resultados filtrados, sem paginação
        exibirAssociacoes(filtrados);
      }

      // MUDANÇA: Função de exibição simplificada, sem paginação
      function exibirAssociacoes(associacoes) {
        const tbody = document.getElementById("associacoes-body");
        tbody.innerHTML = "";
        if (associacoes.length === 0) {
            tbody.innerHTML = '<tr><td colspan="5" style="text-align:center;">Nenhuma associação encontrada.</td></tr>';
            return;
        }

        associacoes.forEach(assoc => {
          const imagemHtml = assoc.IMAGEM_PERFIL_URL
            ? `<img src="${baseUrl}${assoc.IMAGEM_PERFIL_URL}" alt="Perfil de ${assoc.NOME_ASSOCIACAO}" class="profile-image-table">`
            : `<div class="placeholder-image">A</div>`;

          tbody.innerHTML += `
            <tr>
              <td>${imagemHtml}</td>
              <td>${assoc.NOME_ASSOCIACAO || "Sem nome"}</td>
              <td>${assoc.PAIS_ATUACAO || "N/A"}</td>
              <td>${assoc.GRAU || "N/A"}</td>
              <td>
                <a class="detalhes-btn" href="detalhes.html?id=${assoc.ID_ASSOCIACAO}&type=associacao">Ver mais</a>
              </td>
            </tr>
          `;
        });
      }
    </script>
  </body>
</html>
